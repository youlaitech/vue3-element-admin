<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 900" preserveAspectRatio="none">
  <defs>
    <linearGradient id="darkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1a33"/>
      <stop offset="55%" stop-color="#0c1428"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="gridMask">
      <rect width="1400" height="900" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <rect width="1400" height="900" fill="url(#darkBlue)"/>
  <rect width="1400" height="900" fill="url(#grid)" mask="url(#gridMask)"/>
</svg>
