<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1400 900" preserveAspectRatio="none">
  <defs>
    <!-- 白云蓝海渐变：白 → Arco 浅蓝 → #94bfff，整体清淡，朝气不阴暗 -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#f5faff"/>
      <stop offset="32%" stop-color="#f2f8ff"/>
      <stop offset="48%" stop-color="#eef6ff"/>
      <stop offset="62%" stop-color="#e8f3ff"/>
      <stop offset="76%" stop-color="#d6e8ff"/>
      <stop offset="88%" stop-color="#bedaff"/>
      <stop offset="100%" stop-color="#94bfff"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>
</svg>
